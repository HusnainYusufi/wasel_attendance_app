# Wasel Attendance — production stack.
#
#   postgres  never published; reachable only from the API container
#   api       internal; published to loopback only when behind an existing proxy
#   caddy     :80/:443, opt-in via `--profile edge`
#
# Two deployment shapes:
#
#   A server of its own — Caddy terminates TLS and gets its own certificates:
#     docker compose -f docker-compose.prod.yml --env-file .env.production \
#       --profile edge up -d
#
#   A server already running nginx/Traefik — the API binds to loopback and the
#   existing proxy fronts it:
#     docker compose -f docker-compose.prod.yml \
#       -f deploy/docker-compose.behind-proxy.yml \
#       --env-file .env.production up -d
#
# Postgres is deliberately NOT published in either shape. A database reachable
# from the internet is the single most common way a small deployment is
# breached, and nothing outside this network needs it.
#
# Migrations run as a one-shot service that must exit 0 before the API starts, so
# a deploy can never serve traffic against a schema it was not built for.

name: wasel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-wasel_attendance}
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    volumes:
      - wasel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: wasel-api:latest
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wasel_attendance}?schema=public
    # `migrate deploy` only applies committed migrations. It never generates one
    # from drift and never resets — unlike `migrate dev` or `db push`, either of
    # which can destroy production data.
    #
    # Invoked as the binary rather than through pnpm: this service runs on an
    # egress-less network, and `pnpm` under corepack tries to fetch itself from
    # registry.npmjs.org on first use, which fails with EAI_AGAIN.
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: wasel-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wasel_attendance}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?generate with openssl rand -base64 48}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?generate with openssl rand -base64 48}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:?list the app origins, never *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Exactly one proxy sits in front — Caddy, or the host's nginx. Never raise
      # this above the real hop count: each extra hop lets a client forge its own
      # IP in X-Forwarded-For, poisoning the audit log and defeating per-IP limits.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    networks: [internal, web]
    # No `ports:` here on purpose. The edge profile reaches this over the compose
    # network; behind an existing proxy, the overlay publishes it to 127.0.0.1
    # only. Neither shape exposes it on the public interface.

  # One-off: create the organization and its first administrator.
  #
  #   docker compose ... --profile seed run --rm seed
  #
  # Built from the `builder` stage rather than the runtime image on purpose. The
  # seed is a TypeScript script that imports from `src/`, and the runtime image
  # ships only compiled `dist/` — deliberately, since shipping source and a
  # TypeScript loader to production to support a once-per-deployment task is a
  # poor trade. The builder stage already has everything it needs.
  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    image: wasel-api-builder:latest
    restart: 'no'
    working_dir: /repo/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wasel_attendance}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set the first administrator's email}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set the first administrator's password}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Wasel}
      SEED_ORG_TIMEZONE: ${SEED_ORG_TIMEZONE:-UTC}
    # The binary directly, not through pnpm: this network has no egress and
    # corepack would try to fetch pnpm from the registry.
    command: ['./node_modules/.bin/tsx', 'prisma/seed.ts']
    networks: [internal]

  # Opt-in edge. Started only with `--profile edge`, because a server that
  # already terminates TLS (nginx, Traefik, a cloud load balancer) owns :80/:443
  # and a second claimant would either fail to bind or take the existing sites
  # down. Behind an existing proxy, use deploy/docker-compose.behind-proxy.yml
  # instead and leave this out.
  caddy:
    profiles: ['edge']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '80:80'
      - '443:443'
    environment:
      # A bare IP cannot get a public certificate. If you have no domain, use a
      # wildcard-DNS host that resolves to your IP — e.g. 203.0.113.10.sslip.io —
      # and Caddy will obtain a real Let's Encrypt certificate for it.
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname the app will call}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - wasel_caddy_data:/data
      - wasel_caddy_config:/config
    networks: [web]

networks:
  # No internet egress needed between the API and its database.
  internal:
    internal: true
  web:

volumes:
  wasel_pgdata:
  wasel_caddy_data: # certificates live here — losing it means re-issuing them
  wasel_caddy_config:
